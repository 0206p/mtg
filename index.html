<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Sammlungs-Suche</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      max-width: 950px; 
      margin: 0 auto; 
      padding: 30px 15px; 
      background: #0f1115; 
      color: #f0f2f5; 
    }
    h1 { text-align: center; font-size: 2.2rem; margin-bottom: 6px; letter-spacing: 1px; }
    p.subtitle { text-align: center; color: #8a94a6; margin-top: 0; margin-bottom: 20px; }
    .status-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; font-size: 0.85rem; margin-bottom: 20px; }
    .status-badge { background: #1a1e26; padding: 6px 12px; border-radius: 6px; border: 1px solid #2d3544; color: #8a94a6; }
    .status-badge.ok { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
    .status-badge.err { color: #f87171; border-color: rgba(248, 113, 113, 0.4); }
    
    #search { 
      width: 100%; 
      padding: 14px 18px; 
      font-size: 1.1rem; 
      border-radius: 10px; 
      border: 1px solid #2d3544; 
      background: #161a23; 
      color: #fff; 
      outline: none; 
      margin-bottom: 20px; 
      transition: border-color 0.2s; 
    }
    #search:focus { border-color: #3b82f6; }
    
    table { width: 100%; border-collapse: collapse; background: #161a23; border-radius: 8px; overflow: hidden; border: 1px solid #2d3544; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid #232a38; }
    th { background: #1c2230; color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2230; }
    
    /* Hover-Effekt auf Kartennamen */
    .card-cell { 
      cursor: pointer; 
      color: #f8fafc; 
      text-decoration: underline dotted #475569; 
      transition: color 0.15s; 
    }
    .card-cell:hover { 
      color: #60a5fa; 
      text-decoration: underline solid #60a5fa; 
    }

    .badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
    .owner-peter { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
    .owner-flo { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
    .owner-raphi { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .set-tag { background: #232a38; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    .empty-state { text-align: center; color: #64748b; padding: 30px; font-style: italic; }

    /* Schwebende Kartenvorschau */
    #card-preview {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      display: none;
      width: 240px;
      min-height: 335px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      background: #1e232d;
      border: 1px solid #3b82f6;
      overflow: hidden;
    }
    #card-preview img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>MTG KARTENPOOL</h1>
  <p class="subtitle">Gemeinsame Suche in den Sammlungen von Peter, Flo und Raphi</p>

  <div class="status-bar" id="status-container">
    <span class="status-badge">Lade Sammlungen...</span>
  </div>

  <input type="text" id="search" placeholder="Kartenname eingeben (z. B. Sol Ring, Swords, Command...)" autofocus>

  <table>
    <thead>
      <tr>
        <th>Karte (Hover für Bild)</th>
        <th>Edition</th>
        <th>Besitzer</th>
        <th>Anzahl</th>
      </tr>
    </thead>
    <tbody id="results">
      <tr><td colspan="4" class="empty-state">Tippe mindestens 2 Buchstaben ein...</td></tr>
    </tbody>
  </table>

  <!-- Floating Preview Box -->
  <div id="card-preview">
    <img id="preview-img" src="" alt="Kartenvorschau">
  </div>

  <script>
    const sources = [
      { name: "Peter", file: "peter.csv", badge: "owner-peter" },
      { name: "Flo",   file: "flo.csv",   badge: "owner-flo" },
      { name: "Raphi", file: "raphi.csv", badge: "owner-raphi" }
    ];

    let cardInventory = [];
    const statusContainer = document.getElementById("status-container");

    function renderStatus(results) {
      statusContainer.innerHTML = "";
      let total = 0;
      results.forEach(res => {
        const badge = document.createElement("span");
        if (res.success) {
          total += res.count;
          badge.className = "status-badge ok";
          badge.innerText = `${res.name}: ${res.count.toLocaleString()} Karten`;
        } else {
          badge.className = "status-badge err";
          badge.innerText = `${res.name} (${res.file}): Fehler!`;
        }
        statusContainer.appendChild(badge);
      });
      const totalBadge = document.createElement("span");
      totalBadge.className = "status-badge ok";
      totalBadge.style.fontWeight = "bold";
      totalBadge.innerText = `Gesamt: ${total.toLocaleString()} Karten`;
      statusContainer.appendChild(totalBadge);
    }

    // CSV-Dateien parallel laden inklusive Scryfall ID
    Promise.all(sources.map(source => 
      new Promise(resolve => {
        Papa.parse(source.file, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: res => {
            if (!res.data || res.data.length === 0) {
              resolve({ name: source.name, file: source.file, success: false, count: 0, items: [] });
              return;
            }
            const parsed = res.data.map(row => {
              const name = (row["Name"] || row["Card Name"] || row["Card name"] || row["name"] || "").trim();
              const count = parseInt(row["Quantity"] || row["Count"] || row["quantity"] || row["count"] || 1, 10);
              const setCode = (row["Set code"] || row["Set Code"] || row["set code"] || "").trim();
              const scryfallId = (row["Scryfall ID"] || row["Scryfall Id"] || row["scryfall id"] || "").trim();
              
              return {
                name: name,
                count: isNaN(count) ? 1 : count,
                setCode: setCode,
                scryfallId: scryfallId,
                owner: source.name,
                badge: source.badge
              };
            }).filter(item => item.name.length > 0);

            resolve({
              name: source.name,
              file: source.file,
              success: parsed.length > 0,
              count: parsed.length,
              items: parsed
            });
          },
          error: () => resolve({ name: source.name, file: source.file, success: false, count: 0, items: [] })
        });
      })
    )).then(results => {
      renderStatus(results);
      cardInventory = results.flatMap(r => r.items);
    });

    const searchInput = document.getElementById("search");
    const resultsTable = document.getElementById("results");
    const previewBox = document.getElementById("card-preview");
    const previewImg = document.getElementById("preview-img");

    // Suchfilter
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase().trim();
      resultsTable.innerHTML = "";

      if (query.length < 2) {
        resultsTable.innerHTML = '<tr><td colspan="4" class="empty-state">Tippe mindestens 2 Buchstaben ein...</td></tr>';
        return;
      }

      const matches = cardInventory
        .filter(item => item.name.toLowerCase().includes(query))
        .slice(0, 50);

      if (matches.length === 0) {
        resultsTable.innerHTML = '<tr><td colspan="4" class="empty-state">Keine Karte gefunden.</td></tr>';
        return;
      }

      matches.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><strong class="card-cell" data-id="${item.scryfallId}" data-name="${encodeURIComponent(item.name)}">${item.name}</strong></td>
          <td>${item.setCode ? `<span class="set-tag">${item.setCode}</span>` : "-"}</td>
          <td><span class="badge ${item.badge}">${item.owner}</span></td>
          <td>${item.count}x</td>
        `;
        resultsTable.appendChild(row);
      });
    });

    // Hover-Logik für Kartenvorschau
    resultsTable.addEventListener("mouseover", (e) => {
      const target = e.target.closest(".card-cell");
      if (!target) return;
      
      const id = target.dataset.id;
      const name = target.dataset.name;
      
      // Nutze direkte Scryfall ID falls vorhanden, sonst Fallback über Kartennamen
      const imgUrl = id 
        ? `https://api.scryfall.com/cards/${id}?format=image&version=normal` 
        : `https://api.scryfall.com/cards/named?exact=${name}&format=image&version=normal`;

      previewImg.src = imgUrl;
      previewBox.style.display = "block";
    });

    resultsTable.addEventListener("mousemove", (e) => {
      if (previewBox.style.display !== "block") return;
      
      const offset = 20;
      let x = e.clientX + offset;
      let y = e.clientY + offset;

      const boxWidth = 240;
      const boxHeight = 335;

      // Verhindern, dass die Vorschau rechts oder unten aus dem Fenster ragt
      if (x + boxWidth > window.innerWidth) {
        x = e.clientX - boxWidth - offset;
      }
      if (y + boxHeight > window.innerHeight) {
        y = Math.max(10, window.innerHeight - boxHeight - 10);
      }

      previewBox.style.left = `${x}px`;
      previewBox.style.top = `${y}px`;
    });

    resultsTable.addEventListener("mouseout", (e) => {
      const target = e.target.closest(".card-cell");
      if (!target) return;
      previewBox.style.display = "none";
      previewImg.src = "";
    });
  </script>
</body>
</html>
